<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sever Manolescu - GitHub Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner {
            width: 1280px;
            height: 320px;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1c2128 100%);
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(88, 166, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 15s;
        }

        .particle:nth-child(2) {
            width: 60px;
            height: 60px;
            left: 30%;
            animation-delay: 2s;
            animation-duration: 18s;
        }

        .particle:nth-child(3) {
            width: 100px;
            height: 100px;
            right: 15%;
            animation-delay: 4s;
            animation-duration: 20s;
        }

        .particle:nth-child(4) {
            width: 70px;
            height: 70px;
            right: 40%;
            animation-delay: 6s;
            animation-duration: 16s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100%) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            50% {
                transform: translateY(-50%) translateX(30px) scale(1);
                opacity: 0.2;
            }
            90% {
                opacity: 0.1;
            }
        }

        /* Grid background */
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translateX(0) translateY(0);
            }
            100% {
                transform: translateX(50px) translateY(50px);
            }
        }

        /* Content container */
        .content {
            position: relative;
            z-index: 10;
            padding: 40px 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header section */
        .header {
            animation: slideInDown 1s ease-out;
        }

        .name {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(88, 166, 255, 0.3);
        }

        .title {
            font-size: 20px;
            color: #8b949e;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .separator {
            color: #58a6ff;
            font-weight: 300;
        }

        .highlight {
            color: #58a6ff;
            font-weight: 500;
        }

        /* Projects section */
        .projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .project {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(88, 166, 255, 0.05);
            border: 1px solid rgba(88, 166, 255, 0.15);
            border-radius: 8px;
            transition: all 0.3s ease;
            animation: projectPulse 3s ease-in-out infinite;
        }

        .project:nth-child(1) { animation-delay: 0s; }
        .project:nth-child(2) { animation-delay: 0.5s; }
        .project:nth-child(3) { animation-delay: 1s; }
        .project:nth-child(4) { animation-delay: 1.5s; }

        @keyframes projectPulse {
            0%, 100% {
                box-shadow: 0 0 0 rgba(88, 166, 255, 0);
            }
            50% {
                box-shadow: 0 0 20px rgba(88, 166, 255, 0.1);
            }
        }

        .project:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: rgba(88, 166, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
        }

        .project-icon {
            font-size: 24px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .project-name {
            color: #c9d1d9;
            font-size: 16px;
            font-weight: 500;
        }

        .wip-badge {
            color: #58a6ff;
            font-size: 12px;
            font-weight: 600;
            background: rgba(88, 166, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
            animation: wipPulse 2s ease-in-out infinite;
        }

        @keyframes wipPulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* Footer section */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInUp 1s ease-out 0.6s both;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8b949e;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: statusBlink 2s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px #3fb950;
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 4px #3fb950;
            }
        }

        .links {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .link {
            color: #58a6ff;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #58a6ff;
            transition: width 0.3s ease;
        }

        .link:hover::after {
            width: 100%;
        }

        .link:hover {
            color: #79c0ff;
            text-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
        }

        /* Animations */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Corner accent */
        .corner-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at top right, rgba(88, 166, 255, 0.15), transparent 70%);
            pointer-events: none;
            animation: cornerGlow 4s ease-in-out infinite;
        }

        @keyframes cornerGlow {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Download instruction */
        .instruction {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #161b22;
            color: #8b949e;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #30363d;
            width: 90%;
            max-width: 800px;
        }

        .instruction strong {
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div style="position: relative;">
        <div class="banner">
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
            <div class="grid"></div>
            <div class="corner-accent"></div>
            
            <div class="content">
                <div class="header">
                    <div class="name">SEVER MANOLESCU</div>
                    <div class="title">
                        <span class="highlight">C++</span>
                        <span class="separator">•</span>
                        <span class="highlight">Python</span>
                        <span class="separator">•</span>
                        <span class="highlight">C#</span>
                        <span class="separator">|</span>
                        <span>3 Years Experience</span>
                    </div>
                </div>

                <div class="projects">
                    <div class="project">
                        <span class="project-icon">🎮</span>
                        <span class="project-name">Talon Engine</span>
                    </div>
                    <div class="project">
                        <span class="project-icon">🎨</span>
                        <span class="project-name">Ecspel RPG</span>
                    </div>
                    <div class="project">
                        <span class="project-icon">📊</span>
                        <span class="project-name">App Tracker</span>
                        <span class="wip-badge">WIP</span>
                    </div>
                    <div class="project">
                        <span class="project-icon">🏰</span>
                        <span class="project-name">Eridion</span>
                        <span class="wip-badge">WIP</span>
                    </div>
                </div>

                <div class="footer">
                    <div class="status">
                        <span class="status-dot"></span>
                        <span>Former Continental Automotive • Open to Opportunities</span>
                    </div>
                    <div class="links">
                        <a href="#" class="link">github.com/severmanolescu</a>
                        <a href="#" class="link">linkedin.com/in/sever-manolescu</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="instruction">
            <strong>To save:</strong> Right-click the banner → "Save image as..." or take a screenshot at exactly 1280x320px
        </div>
    </div>
</body>
</html>
