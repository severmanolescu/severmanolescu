<svg width="1280" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c2128;stop-opacity:1" />
    </linearGradient>
    
    <!-- Radial gradient for corner accent -->
    <radialGradient id="cornerGlow" cx="100%" cy="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="70%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Particle glow -->
    <radialGradient id="particleGlow">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Status dot glow -->
    <radialGradient id="statusGlow">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0" />
    </radialGradient>
    
    <!-- Animations -->
    <style>
      @keyframes float1 {
        0%, 100% { opacity: 0; transform: translateY(320px); }
        10% { opacity: 0.3; }
        50% { opacity: 0.2; transform: translateY(160px) translateX(30px); }
        90% { opacity: 0.1; }
      }
      
      @keyframes float2 {
        0%, 100% { opacity: 0; transform: translateY(320px); }
        10% { opacity: 0.3; }
        50% { opacity: 0.2; transform: translateY(140px) translateX(-20px); }
        90% { opacity: 0.1; }
      }
      
      @keyframes float3 {
        0%, 100% { opacity: 0; transform: translateY(320px); }
        10% { opacity: 0.3; }
        50% { opacity: 0.2; transform: translateY(120px) translateX(40px); }
        90% { opacity: 0.1; }
      }
      
      @keyframes float4 {
        0%, 100% { opacity: 0; transform: translateY(320px); }
        10% { opacity: 0.3; }
        50% { opacity: 0.2; transform: translateY(150px) translateX(-30px); }
        90% { opacity: 0.1; }
      }
      
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      @keyframes wipPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @keyframes cornerGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.8; }
      }
      
      .particle1 { animation: float1 15s infinite; }
      .particle2 { animation: float2 18s infinite 2s; }
      .particle3 { animation: float3 20s infinite 4s; }
      .particle4 { animation: float4 16s infinite 6s; }
      
      .status-dot { animation: statusBlink 2s ease-in-out infinite; }
      .status-glow { animation: statusBlink 2s ease-in-out infinite; }
      
      .wip-badge { animation: wipPulse 2s ease-in-out infinite; }
      .wip-badge-2 { animation: wipPulse 2s ease-in-out infinite 0.5s; }
      
      .corner-accent { animation: cornerGlow 4s ease-in-out infinite; }
      
      .project-card { transition: transform 0.3s ease; }
      .project-card:hover { transform: translateY(-2px); }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.03">
    <defs>
      <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#58a6ff" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1280" height="320" fill="url(#grid)"/>
  </g>
  
  <!-- Floating Particles -->
  <circle class="particle1" cx="128" cy="320" r="40" fill="url(#particleGlow)"/>
  <circle class="particle2" cx="384" cy="320" r="30" fill="url(#particleGlow)"/>
  <circle class="particle3" cx="1088" cy="320" r="50" fill="url(#particleGlow)"/>
  <circle class="particle4" cx="768" cy="320" r="35" fill="url(#particleGlow)"/>
  
  <!-- Corner Accent -->
  <ellipse class="corner-accent" cx="1280" cy="0" rx="200" ry="200" fill="url(#cornerGlow)"/>
  
  <!-- Header Section -->
  <g id="header">
    <!-- Name -->
    <text x="60" y="80" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="1">
      SEVER MANOLESCU
    </text>
    
    <!-- Title -->
    <text x="60" y="108" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#8b949e">
      <tspan fill="#58a6ff" font-weight="500">C++</tspan>
      <tspan fill="#58a6ff" dx="10" font-weight="300">•</tspan>
      <tspan fill="#58a6ff" dx="10" font-weight="500">Python</tspan>
      <tspan fill="#58a6ff" dx="10" font-weight="300">•</tspan>
      <tspan fill="#58a6ff" dx="10" font-weight="500">C#</tspan>
      <tspan dx="10" font-weight="300">|</tspan>
      <tspan dx="10">3 Years Experience</tspan>
    </text>
  </g>
  
  <!-- Projects Section -->
  <g id="projects">
    <!-- Project 1: Talon Engine -->
    <g class="project-card">
      <rect x="60" y="150" width="570" height="52" rx="8" fill="rgba(88, 166, 255, 0.05)" stroke="rgba(88, 166, 255, 0.15)" stroke-width="1"/>
      <text x="92" y="182" font-size="24">🎮</text>
      <text x="136" y="182" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#c9d1d9">Talon Engine</text>
    </g>
    
    <!-- Project 2: Ecspel RPG -->
    <g class="project-card">
      <rect x="650" y="150" width="570" height="52" rx="8" fill="rgba(88, 166, 255, 0.05)" stroke="rgba(88, 166, 255, 0.15)" stroke-width="1"/>
      <text x="682" y="182" font-size="24">🎨</text>
      <text x="726" y="182" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#c9d1d9">Ecspel RPG</text>
    </g>
    
    <!-- Project 3: App Tracker -->
    <g class="project-card">
      <rect x="60" y="218" width="570" height="52" rx="8" fill="rgba(88, 166, 255, 0.05)" stroke="rgba(88, 166, 255, 0.15)" stroke-width="1"/>
      <text x="92" y="250" font-size="24">📊</text>
      <text x="136" y="250" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#c9d1d9">App Tracker</text>
      <rect class="wip-badge" x="540" y="232" width="70" height="24" rx="4" fill="rgba(88, 166, 255, 0.1)"/>
      <text x="560" y="248" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#58a6ff">WIP</text>
    </g>
    
    <!-- Project 4: Eridion -->
    <g class="project-card">
      <rect x="650" y="218" width="570" height="52" rx="8" fill="rgba(88, 166, 255, 0.05)" stroke="rgba(88, 166, 255, 0.15)" stroke-width="1"/>
      <text x="682" y="250" font-size="24">🏰</text>
      <text x="726" y="250" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#c9d1d9">Eridion</text>
      <rect class="wip-badge-2" x="1130" y="232" width="70" height="24" rx="4" fill="rgba(88, 166, 255, 0.1)"/>
      <text x="1150" y="248" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#58a6ff">WIP</text>
    </g>
  </g>
  
  <!-- Footer Section -->
  <g id="footer">
    <!-- Status -->
    <g id="status">
      <!-- Status dot glow -->
      <circle class="status-glow" cx="68" cy="297" r="6" fill="url(#statusGlow)"/>
      <!-- Status dot -->
      <circle class="status-dot" cx="68" cy="297" r="4" fill="#3fb950"/>
      <text x="84" y="302" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">
        Former Continental Automotive • Open to Opportunities
      </text>
    </g>
    
    <!-- Links -->
    <g id="links">
      <text x="865" y="302" font-family="'Segoe UI', sans-serif" font-size="14" fill="#58a6ff">
        github.com/severmanolescu
      </text>
      <text x="1065" y="302" font-family="'Segoe UI', sans-serif" font-size="14" fill="#58a6ff">
        linkedin.com/in/sever-manolescu
      </text>
    </g>
  </g>
</svg>
